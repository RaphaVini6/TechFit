version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: techfit_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: techfit
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - techfit_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techfit_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://admin:senha123@database:5432/techfit
      JWT_SECRET: sua_chave_secreta_super_segura_123
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - database
    networks:
      - techfit_network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techfit_frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - techfit_network
    command: npm start

volumes:
  postgres_data:

networks:
  techfit_network:
    driver: bridge