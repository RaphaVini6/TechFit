<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cadastro - TechFit</title>
    <link rel="stylesheet" href="../../base.css">
    <link rel="stylesheet" href="../login/login.css">
</head>
<body>
<div class="wrapper">
    <div class="form-wrapper">
        <form id="cadastro-form">
            <a href="../../index.html"><img class="logo-form" src="../../assets/logo0.png" alt="TechFit"></a>
            <h1>Cadastro</h1>
            <p id="msg" class="msg" role="alert" hidden></p>
            <div class="input-group">
                <input type="text" id="nome" autocomplete="name" required>
                <label for="nome">Nome</label>
            </div>
            <div class="input-group">
                <input type="email" id="email" autocomplete="email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-group">
                <input type="password" id="senha" autocomplete="new-password" minlength="6" required>
                <label for="senha">Senha</label>
            </div>
            <button type="submit" class="btn">Cadastrar</button>
            <p class="login-link">Já possui cadastro? <a href="../login/login.html">Logar</a></p>
        </form>
    </div>
</div>
<script src="../../scripts/ui.js"></script>
<script src="../../scripts/cadastro.js"></script>
</body>
</html>
