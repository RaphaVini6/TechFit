<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino do Mês - TechFit</title>
    <link rel="stylesheet" href="../../base.css">
    <link rel="stylesheet" href="treino.css">
</head>
<body>

<div class="training-table">
    <div class="background-rectangle"></div>
    <div class="training-table-title">Tabela de Treino</div>
    <div id="dias" style="display:contents"></div>
    <div class="bottom-rectangle"></div>
</div>

<script>
(async () => {
  const token = localStorage.getItem('token');
  if (!token) { window.location.href = '../login/login.html'; return; }
  const alvo = document.getElementById('dias');
  try {
    const r = await fetch('/treino', { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { localStorage.removeItem('token'); window.location.href = '../login/login.html?expirou=1'; return; }
    const treinos = await r.json();
    treinos.forEach((t) => {
      const coluna = document.createElement('div');
      coluna.className = 'day-column';
      const dia = document.createElement('div');
      dia.className = 'training-day';
      const label = document.createElement('span');
      label.className = 'day-label';
      label.textContent = t.dia;
      const grupo = document.createElement('span');
      grupo.className = 'training-label';
      grupo.textContent = t.grupo;
      dia.append(label, document.createElement('br'), document.createElement('br'), grupo);
      coluna.appendChild(dia);
      alvo.appendChild(coluna);
    });
  } catch (erro) {
    alvo.textContent = 'Não foi possível carregar o treino.';
  }
})();
</script>
</body>
</html>
