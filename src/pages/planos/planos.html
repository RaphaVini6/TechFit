<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planos da Academia</title>
    <link rel="stylesheet" href="../../base.css">
    <link rel="stylesheet" href="plano.css">
</head>
<body>
    <section class="section__container price__container">
        <h2 class="section__header">NOSSOS PLANOS</h2>
        <p class="section__subheader">Escolha o plano que melhor se adapta a você e comece a treinar hoje mesmo! Nossos planos são projetados para atender a todas as necessidades e modalidades.</p>
        <div class="price__grid" id="planos-grid" aria-live="polite">
            <p>Carregando planos...</p>
        </div>
    </section>

<script>
(async () => {
  const grid = document.getElementById('planos-grid');
  const logado = !!localStorage.getItem('token');
  try {
    const planos = await fetch('/planos').then((r) => r.json());
    grid.innerHTML = '';
    planos.forEach((plano) => {
      const card = document.createElement('div');
      card.className = 'price__card';
      const conteudo = document.createElement('div');
      conteudo.className = 'price__card__content';
      const nome = document.createElement('h4');
      nome.textContent = plano.nome;
      const preco = document.createElement('h3');
      preco.textContent = plano.preco ? 'R$' + plano.preco : 'Grátis';
      conteudo.append(nome, preco);
      plano.beneficios.forEach((b) => {
        const p = document.createElement('p');
        p.textContent = '✓ ' + b;
        conteudo.appendChild(p);
      });
      const link = document.createElement('a');
      link.href = logado ? '../client/client.html' : '../cadastro/cadastro.html';
      const botao = document.createElement('button');
      botao.className = 'btn price__btn';
      botao.textContent = logado ? 'Escolher na minha conta' : 'Assine';
      link.appendChild(botao);
      card.append(conteudo, link);
      grid.appendChild(card);
    });
  } catch (erro) {
    grid.textContent = 'Não foi possível carregar os planos.';
  }
})();
</script>
</body>
</html>
